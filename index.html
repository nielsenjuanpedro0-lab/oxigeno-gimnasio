<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gimnasio Oxígeno — Gimnasio en Necochea | Sala de fuerza y clases</title>
    <meta
      name="description"
      content="Gimnasio en Necochea, Av. 58 n° 3752. Sala de fuerza, clases aeróbicas, funcional y G.A.P. Abierto de lunes a viernes de 7:00 a 21:30 y sábados de 8:00 a 14:00. Planes desde $20.000."
    />
    <link rel="canonical" href="https://gimnasiooxigeno.com.ar/" />

    <!--
      Tipografías propias y precargadas.

      Servirlas desde el mismo origen y precargarlas hace que lleguen antes del primer
      pintado: no hay reemplazo de fuente, así que no hay salto de layout, y el
      visitante ve la tipografía de la marca desde el primer instante.

      Antes se pedían a fonts.googleapis.com con display=optional. Eso resolvía el
      salto, pero a costa de que en una primera visita algo lenta la página se
      renderizara entera con la tipografía de reserva — y en este diseño la tipografía
      es la marca.
    -->
    <link
      rel="preload"
      href="/fonts/archivo-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-tight-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="author" content="Gimnasio Oxígeno" />

    <!-- Señales geográficas para búsqueda local. -->

    <!--
      Datos estructurados.

      Van en el HTML estático a propósito: esta es una SPA, así que el contenido de la
      página aparece recién después de ejecutar JavaScript. Los buscadores lo renderizan,
      pero muchos rastreadores de motores generativos no. Este bloque les da los datos
      del negocio —dirección, horarios, precios, contacto— sin depender de JavaScript.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HealthClub",
      "@id": "https://gimnasiooxigeno.com.ar/#gimnasio",
      "name": "Gimnasio Oxígeno",
      "alternateName": "Oxígeno Gym",
      "description": "Gimnasio en Necochea con sala de fuerza, actividades aeróbicas y clases grupales guiadas por profesores.",
      "url": "https://gimnasiooxigeno.com.ar/",
      "image": "https://gimnasiooxigeno.com.ar/og-image.jpg",
      "telephone": "+5492262664679",
      "priceRange": "$$",
      "currenciesAccepted": "ARS",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Av. 58 n° 3752",
        "addressLocality": "Necochea",
        "addressRegion": "Buenos Aires",
        "postalCode": "7630",
        "addressCountry": "AR"
      },
      "areaServed": {
        "@type": "City",
        "name": "Necochea"
      },
      "hasMap": "https://www.google.com/maps/search/?api=1&query=Av.+58+3752+Necochea+Buenos+Aires",
      "sameAs": ["https://www.instagram.com/oxigeno.fitnessgym_"],
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "07:00",
          "closes": "21:30"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": "Saturday",
          "opens": "08:00",
          "closes": "14:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": "Sunday",
          "opens": "00:00",
          "closes": "00:00"
        }
      ],
      "amenityFeature": [
        { "@type": "LocationFeatureSpecification", "name": "Sala de fuerza", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Actividades aeróbicas", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Zona de cardio", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Clases grupales", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Showroom Hype Fitness", "value": true }
      ],
      "makesOffer": [
        {
          "@type": "Offer",
          "name": "Plan Black",
          "description": "Acceso libre diario, sin restricción horaria.",
          "price": "70000",
          "priceCurrency": "ARS",
          "availability": "https://schema.org/InStock"
        },
        {
          "@type": "Offer",
          "name": "Plan Silver",
          "description": "Acceso 3 veces por semana.",
          "price": "60000",
          "priceCurrency": "ARS",
          "availability": "https://schema.org/InStock"
        },
        {
          "@type": "Offer",
          "name": "Clase individual",
          "description": "Una clase, acceso por el día.",
          "price": "20000",
          "priceCurrency": "ARS",
          "availability": "https://schema.org/InStock"
        }
      ]
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

  </head>

  <body>
